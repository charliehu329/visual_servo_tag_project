# velocity_servo_tag.yaml
#
# AprilTag USB 相机检测节点配置。


apriltag_detector:
  ros__parameters:
    camera_index: 2
    camera_width: 1280
    camera_height: 720
    camera_fps: 60.0

    # 第二台 USB 相机：同轮采集、独立检测，不显示第二路预览。
    # camera_2_index 请填写实际设备编号，不能与 camera_index 相同。
    camera_2_enabled: true
    camera_2_index: 0
    camera_2_width: 1280
    camera_2_height: 720
    camera_2_fps: 60.0
    # 两路采集频率必须一致；软件 grab 完成时间差上限，不是曝光同步保证。
    camera_pair_max_delta_ms: 60.0
    # 两路成功取图 FPS 的日志统计周期，单位 s。
    camera_fps_log_interval_s: 20.0

    camera_2_tag_family: "tag36h11"
    camera_2_target_tag_id: 0
    camera_2_detector_threads: 8
    camera_2_quad_decimate: 4.0
    camera_2_quad_sigma: 0.0
    camera_2_refine_edges: true
    camera_2_decode_sharpening: 0.25
    camera_2_uv_filter_alpha: 1.0
    # 第二路内参需换成实际标定值；当前只发送 u/v，不用深度范围筛选。
    camera_2_fx: 2057.0
    camera_2_fy: 2054.0
    camera_2_cx: 1000.0
    camera_2_cy: 592.0
    camera_2_tag_size_m: 0.10
    camera_2_depth_filter_alpha: 0.4
    camera_2_depth_min_m: 0.10
    camera_2_depth_max_m: 2.00
    camera_2_max_edge_ratio: 1.8

    tag_family: "tag36h11"
    target_tag_id: 0

    detector_threads: 8
    quad_decimate: 4.0
    quad_sigma: 0.0
    refine_edges: true
    decode_sharpening: 0.25

    uv_filter_alpha: 1.0

    camera_fx: 2057.0
    camera_fy: 2054.0
    camera_cx: 1000.0
    camera_cy: 592.0

    # tag36h11 标签最外侧黑色方形的边长，不含白边。
    # 几何深度 Z = camera_fx * tag_size_m / 标签像素边长，对该值 1:1 敏感，
    # 改之前请用尺量一次实际边长。
    tag_size_m: 0.10

    depth_filter_alpha: 0.4
    # 几何深度法的深度窗口。原来的 0.01~5.80 m 几乎不过滤任何异常值；
    # 这里按实际工作范围收紧，超出即丢帧并在终端打印原因。
    depth_min_m: 0.10
    depth_max_m: 2.00

    # 四边形边长比 max(edge)/min(edge) 上限：剔除被裁切、遮挡或误检的
    # 四边形。正常倾斜通常不超过 1.3，0 表示不检查。
    max_edge_ratio: 1.8

    # 消息顺序：[valid1, valid2, u1, v1, u2, v2]，无效路坐标为 0。
    target_position_topic: "/apriltag_detector/target_position"
    use_dynamic_camera_info: true
    camera_info_topic: "/lens/camera_info"
    show_window: true
