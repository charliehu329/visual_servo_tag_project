# velocity_servo_tag.yaml
#
# AprilTag检测、相机速度映射和Franka关节速度命令节点的统一配置。


apriltag_detector:
  ros__parameters:
    camera_index: 2
    camera_width: 1920
    camera_height: 1080
    camera_fps: 60.0

    tag_family: "tag36h11"
    target_tag_id: 0

    detector_threads: 8
    quad_decimate: 2.0
    quad_sigma: 0.0
    refine_edges: true
    decode_sharpening: 0.25

    # 一阶低通滤波系数：
    # 1.0表示不滤波，数值越小越平滑。
    uv_filter_alpha: 1.0

    target_position_topic: "/apriltag_detector/target_position"
    show_window: true


velocity_mapper_node:
  ros__parameters:
    urdf_path: ""
    end_effector_frame: "fr3_hand_tcp"

    T_end_effector_camera: [
      0.685367986922,  0.727986036940,  0.017522914211, -0.0495,
      -0.727707409066,  0.683826802626,  0.053130319028,  0.0191,
      0.026695491993, -0.049165374297,  0.998433831897,  0.1396,
      0.0,             0.0,             0.0,             1.0
    ]

    dry_run: false

    joint_state_topic: "/franka/joint_states"
    visual_velocity_topic: "/simulink/camera_velocity"
    command_topic: "/velocity_mapper_node/target_joints_velocities"


velocity_command_node:
  ros__parameters:
    # 默认zero最安全。
    # 真正接收mapper速度时由launch覆盖为topic。
    mode: "zero"

    publish_rate_hz: 120.0

    # 相对于FR3官方关节速度上限的最终保护比例。
    max_velocity_scale: 0.80

    # 底层命令桥接层的加速度限制，单位rad/s²。
    max_joint_accelerations:
      - 0.50
      - 0.50
      - 0.50
      - 0.50
      - 0.50
      - 0.50
      - 0.50

    # mapper崩溃或停止发布后，超过此时间开始平滑减速。
    target_velocity_timeout_sec: 0.15

    input_topic: "/velocity_mapper_node/target_joints_velocities"
    command_topic: "/joint_velocity_example_controller/commands"



fast_xy_visual_servo:
  ros__parameters:
    # 相机
    camera_index: 2
    camera_width: 1920
    camera_height: 1080
    camera_fps: 60.0

    # 1920×1080相机内参
    fx_px: 2057.0
    fy_px: 2054.0
    cx_px: 1000.0
    cy_px: 592.0

    # AprilTag
    tag_family: "tag36h11"
    target_tag_id: 0
    detector_threads: 8
    quad_decimate: 2.0

    # 固定工作距离尺度
    motion_scale_m: 0.75

    # 初次测试先只开比例控制
    kp_x: 2.0
    kp_y: 2.0
    kff: 0.0

    # 初次硬件测试先限制到较低速度
    camera_speed_max_m_s: 0.30

    # EKF
    ekf_measurement_noise_px: 1.5
    ekf_acceleration_noise_m_s2: 2.0

    # 输出给现有mapper
    camera_velocity_topic: "/simulink/camera_velocity"

    # 调试输出
    debug_topic: "/fast_xy_visual_servo/debug"


# Simulink v2 ROS 2接口。
# MATLAB初始化脚本也从本节读取，修改后无需改SLX。
simulink_ros2:
  ros__parameters:
    sample_time_sec: 0.016666666666666666
    vision_topic: "/vision_double/target_features"
    joint_state_topic: "/franka/joint_states"
    focal_state_topic: "/vision_double/focal_lengths_mm"
    camera_velocity_topic: "/simulink/camera_velocity"
    zoom_velocity_topic: "/simulink/zoom_velocities_mm_s"
    input_timeout_sec: 0.20
    vision_message_length: 8
    focal_message_length: 2
    camera_velocity_message_length: 6
    zoom_velocity_message_length: 2





