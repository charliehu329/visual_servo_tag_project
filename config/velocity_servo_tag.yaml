# velocity_servo_tag.yaml
#
# AprilTag检测、相机速度映射和Franka关节速度命令节点的统一配置。


apriltag_detector:
  ros__parameters:
    camera_index: 3
    camera_width: 1920
    camera_height: 1080
    camera_fps: 60.0

    tag_family: "tag36h11"
    target_tag_id: 0

    detector_threads: 8
    quad_decimate: 2.0
    quad_sigma: 0.0
    refine_edges: true
    decode_sharpening: 0.25

    uv_filter_alpha: 1.0

    camera_fx: 2057.0
    camera_fy: 2054.0
    camera_cx: 1000.0
    camera_cy: 592.0

    tag_size_m: 0.10

    depth_filter_alpha: 0.4
    depth_min_m: 0.01
    depth_max_m: 5.80

    target_position_topic: "/apriltag_detector/target_position"
    show_window: true


velocity_mapper_node:
  ros__parameters:
    urdf_path: ""
    end_effector_frame: "fr3_link8"

    T_end_effector_camera: [
      0.685367986922,  0.727986036940,  0.017522914211, -0.0495,
      -0.727707409066,  0.683826802626,  0.053130319028,  0.0191,
      0.026695491993, -0.049165374297,  0.998433831897,  0.1396,
      0.0,             0.0,             0.0,             1.0
    ]

    dry_run: false

    joint_state_topic: "/franka/joint_states"
    visual_velocity_topic: "/simulink/camera_velocity"
    command_topic: "/velocity_mapper_node/target_joints_velocities"


velocity_command_node:
  ros__parameters:
    # 默认zero最安全。
    # 真正接收mapper速度时由launch覆盖为topic。
    mode: "zero"

    publish_rate_hz: 120.0

    # 相对于FR3官方关节速度上限的最终保护比例。
    max_velocity_scale: 0.80

    # 底层命令桥接层的加速度限制，单位rad/s²。
    max_joint_accelerations:
      - 0.50
      - 0.50
      - 0.50
      - 0.50
      - 0.50
      - 0.50
      - 0.50

    # mapper崩溃或停止发布后，超过此时间开始平滑减速。
    target_velocity_timeout_sec: 0.15

    input_topic: "/velocity_mapper_node/target_joints_velocities"
    command_topic: "/joint_velocity_example_controller/commands"


zoom_controller_node:
  ros__parameters:
    dry_run: true
    serial_port: "/dev/serial/by-id/CHANGE_ME"
    serial_baud: 115200
    serial_command_timeout_sec: 35.0
    target_topic: "/lens/target_intrinsics"
    state_topic: "/lens/zoom_state"
    camera_info_topic: "/lens/camera_info"
    camera_frame_id: "camera_optical_frame"
    image_width: 1920
    image_height: 1080
    max_fx_fy_disagreement_steps: 20.0
    zoom_deadband_steps: 3
    zoom_samples: [0.0, 400.0, 800.0, 1200.0, 1600.0, 2000.0, 2400.0]
    fx_samples: [2035.797529, 2331.545143, 2713.737027, 3137.392785, 3684.865723, 4505.996199, 5494.414672]
    fy_samples: [2034.742218, 2331.622073, 2714.807451, 3138.780385, 3683.854745, 4503.318979, 5490.231460]
    cx_samples: [946.313693, 931.606961, 945.418505, 930.987463, 930.964585, 928.012695, 894.846174]
    cy_samples: [749.155224, 766.482076, 774.908282, 766.529524, 757.853146, 756.246991, 746.485232]
    # Flattened [k1,k2,p1,p2,k3] rows; k3 is constrained to zero.
    distortion_samples_flat: [
      -0.258094321, 0.261993622, 0.000111694, 0.002053981, 0.0,
      -0.235809222, 0.428278290, 0.001437905, -0.001850212, 0.0,
      -0.188571553, 0.616540501, 0.002934832, -0.001131934, 0.0,
      -0.166386778, 0.918454335, 0.003322227, -0.003138638, 0.0,
      -0.115889778, 0.972427637, 0.002954982, -0.001741346, 0.0,
      -0.087717949, 1.419104638, 0.003376276, -0.002862911, 0.0,
      -0.080995647, 1.287880442, 0.002501424, -0.005151698, 0.0
    ]







